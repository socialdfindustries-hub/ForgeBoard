<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ForgeBoard — Hero A (Analogue cinematic)</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Instrument+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --black:#000000; --white:#FFFFFF; --amber:#FFA600;
    --gray:#8a8a8a; --gray-dim:#3a3a3a;
  }
  html, body {
    background: var(--black); color: var(--white);
    font-family: 'Instrument Sans', sans-serif; overflow-x: hidden;
  }
  body { min-height: 100vh; }

  /* ---- Overlays ---- */
  .grid-overlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: 0.035;
    background-image:
      linear-gradient(rgba(255,255,255,0.5) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.5) 1px, transparent 1px);
    background-size: 80px 80px;
  }
  .noise {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    opacity: 0.03; mix-blend-mode: overlay;
  }
  .noise svg { width: 100%; height: 100%; }

  /* ---- Nav ---- */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 40px;
    backdrop-filter: blur(12px);
    background: rgba(0,0,0,0.35);
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .logo {
    font-family: 'Instrument Sans', sans-serif;
    font-weight: 800; font-size: 17px;
    letter-spacing: 0.5px; text-transform: uppercase;
    color: var(--white);
  }
  .logo span { color: var(--amber); }

  .nav-links {
    display: flex; gap: 36px; list-style: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    color: #c8c8c8;
  }
  .nav-links a { color: inherit; text-decoration: none; transition: color .2s; }
  .nav-links a:hover { color: var(--amber); }

  .nav-cta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--black); background: var(--amber);
    padding: 10px 20px; border-radius: 999px;
    text-decoration: none; font-weight: 700;
    transition: transform .2s, box-shadow .2s;
  }
  .nav-cta:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(255,166,0,0.25);
  }

  /* ---- Hero ---- */
  .hero {
    position: relative; z-index: 5;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 100px 24px 60px;
    text-align: center;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
    color: var(--gray);
    opacity: 0; animation: fadeUp 1s ease 0.3s forwards;
  }
  .eyebrow .amber { color: var(--amber); }

  .boards-wrap {
    position: relative;
    margin-top: 40px;
    width: 100%; max-width: 940px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; animation: fadeUp 1.4s ease 0.5s forwards;
  }
  /* Soft floor shadow under the boards */
  .boards-wrap::after {
    content: ''; position: absolute; bottom: -20px; left: 15%; right: 15%;
    height: 40px;
    background: radial-gradient(ellipse at center,
      rgba(0,0,0,0.6) 0%, transparent 70%);
    filter: blur(12px); z-index: -1; pointer-events: none;
  }
  .boards-wrap img {
    position: relative;
    width: 100%; height: auto; display: block;
    filter: drop-shadow(0 30px 40px rgba(0,0,0,0.7));
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .product-names {
    margin-top: 8px;
    display: flex; gap: 60px; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--gray);
    opacity: 0; animation: fadeIn 1s ease 1s forwards;
  }
  .product-names div { display: flex; align-items: center; gap: 8px; }
  .product-names .dot { width: 5px; height: 5px; border-radius: 999px; background: var(--amber); }

  .cta-pill {
    margin-top: 40px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--white);
    background: transparent;
    border: 1px solid rgba(255,255,255,0.25);
    padding: 14px 32px; border-radius: 999px;
    text-decoration: none;
    display: inline-flex; align-items: center; gap: 12px;
    transition: all 0.3s;
    opacity: 0; animation: fadeUp 1s ease 1.1s forwards;
  }
  .cta-pill:hover {
    background: var(--amber);
    color: var(--black);
    border-color: var(--amber);
    box-shadow: 0 10px 40px rgba(255,166,0,0.3);
  }
  .cta-pill .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--amber); }
  .cta-pill:hover .dot { background: var(--black); }

  .scroll-hint {
    position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--gray);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    opacity: 0; animation: fadeIn 1s ease 1.5s forwards;
  }
  .scroll-hint .bar {
    width: 1px; height: 36px;
    background: linear-gradient(to bottom, var(--amber), transparent);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes fadeUp { from {opacity:0; transform: translateY(24px);} to {opacity:1; transform: translateY(0);} }
  @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
  @keyframes pulse {
    0%,100% { opacity: 0.3; transform: scaleY(0.5); }
    50% { opacity: 1; transform: scaleY(1); }
  }

  /* Variant label (remove when real) */
  .variant-tag {
    position: fixed; top: 50%; right: 20px; transform: translateY(-50%) rotate(90deg);
    transform-origin: center; font-family:'JetBrains Mono',monospace;
    font-size: 10px; letter-spacing: 3px; color: var(--gray-dim);
    text-transform: uppercase; z-index: 30; pointer-events: none;
  }
</style>
</head>
<body>

<div class="grid-overlay"></div>
<div class="noise">
  <svg>
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>
</div>

<span class="variant-tag">Hero A · Analogue cinematic</span>

<nav>
  <div class="logo"><span>FORGE</span> BOARD</div>
  <ul class="nav-links">
    <li><a href="#">Products</a></li>
    <li><a href="#">Docs</a></li>
    <li><a href="#">Community</a></li>
    <li><a href="#">Blog</a></li>
    <li><a href="#">Support</a></li>
  </ul>
  <a href="#" class="nav-cta">Shop</a>
</nav>

<section class="hero">
  <p class="eyebrow">ESP32-S3 Development Platform <span class="amber">·</span> Available Now</p>

  <div class="boards-wrap">
    <img src="boards.png" alt="ForgeBoard Beginner and Intermediate">
  </div>

  <div class="product-names">
    <div><span class="dot"></span>Forge Board Intermediate</div>
    <div><span class="dot"></span>Forge Board Beginner</div>
  </div>

  <a href="#" class="cta-pill"><span class="dot"></span>Shop Now</a>

  <div class="scroll-hint">
    <span>Scroll to explore</span>
    <span class="bar"></span>
  </div>
</section>

</body>
</html>
